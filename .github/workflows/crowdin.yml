name: Crowdin Translations Sync 🌐

on:
  # Upload POT file to Crowdin when it changes
  push:
    branches:
      - translation-workflow-test
    paths:
      - 'languages/pressbooks-book.pot'

  # Daily sync to download translations
  schedule:
    - cron: '0 0 * * *'

  # Manual trigger
  workflow_dispatch:

jobs:
  # Upload sources to Crowdin when POT file changes
  upload-sources:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: translation-workflow-test

      - name: Crowdin Upload Sources
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          crowdin_branch_name: translation-workflow-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_OPEN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_API_SECRET }}

  # Download translations and compile MO files
  download-translations:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: translation-workflow-test

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: wp-cli/wp-cli-bundle

      - name: Crowdin Download
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          crowdin_branch_name: translation-workflow-test
          create_pull_request: true
          pull_request_title: 'chore(l10n): Translations updates'
          pull_request_body: |
            ## Translations Update

            This PR contains the latest translation updates from Crowdin.

            ### Changes
            - Updated PO files from Crowdin
            - Compiled MO files automatically

            **Note:** This PR was automatically generated by the Crowdin GitHub Action.
          pull_request_labels: translations, automated
          pull_request_base_branch_name: translation-workflow-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_OPEN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_API_SECRET }}

      - name: Generate .mo files from .po files
        if: success()
        run: wp i18n make-mo languages/

      - name: Commit MO files via API
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the PR created by Crowdin
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:l10n_crowdin_action`
            });
            
            if (pulls.length === 0) {
              console.log('No Crowdin PR found');
              return;
            }
            
            const pr = pulls[0];
            console.log(`Found PR #${pr.number}`);
            
            // Get the PR branch
            const branch = pr.head.ref;
            
            // Get current commit SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            
            // Get the tree
            const { data: commit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: ref.object.sha
            });
            
            // Create blobs for MO files
            const moFiles = fs.readdirSync('languages').filter(f => f.endsWith('.mo'));
            const treeItems = [];
            
            for (const file of moFiles) {
              const content = fs.readFileSync(path.join('languages', file), { encoding: 'base64' });
              const { data: blob } = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: content,
                encoding: 'base64'
              });
              treeItems.push({
                path: `languages/${file}`,
                mode: '100644',
                type: 'blob',
                sha: blob.sha
              });
            }
            
            // Create new tree
            const { data: newTree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: commit.tree.sha,
              tree: treeItems
            });
            
            // Create commit
            const { data: newCommit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'chore(l10n): compile MO files',
              tree: newTree.sha,
              parents: [ref.object.sha]
            });
            
            // Update branch reference
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
              sha: newCommit.sha,
              force: false
            });
            
            console.log('MO files committed successfully');
